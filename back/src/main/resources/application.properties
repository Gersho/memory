spring.application.name=memory
server.servlet.context-path=/api

# MySQL Connection (Host replaced from localhost to docker container service name 'memory_db')
spring.datasource.url=jdbc:mysql://memory_db:3306/memory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=sqluser
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security
spring.security.user.name=testuser
spring.security.user.password=123456

# Debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

